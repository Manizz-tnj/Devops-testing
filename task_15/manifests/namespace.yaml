apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: production-app
  namespace: argocd

spec:

  project: production-project

  source:
    repoURL: https://github.com/<YOUR_GITHUB_USERNAME>/<YOUR_REPOSITORY_NAME>.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

      allowEmpty: false

    syncOptions:

      - CreateNamespace=true

      - ApplyOutOfSyncOnly=true

      - PrunePropagationPolicy=foreground

      - PruneLast=true

      - RespectIgnoreDifferences=true

  revisionHistoryLimit: 10