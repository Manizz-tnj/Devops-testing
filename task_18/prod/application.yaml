apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:

  name: payment-dev

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/<username>/gitops-platform.git

    targetRevision: main

    path: dev

  destination:

    server: https://kubernetes.default.svc

    namespace: dev

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true
